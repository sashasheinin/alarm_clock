; Minecraft Clock — Waveshare ESP32-S3-Touch-AMOLED-2.16.
; Platform, board, memory type and libraries match Clawdmeter's
; waveshare_amoled_216 env, which is known to build and run on this board.

[env:clock]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; OPI PSRAM: without this, PSRAM allocations return NULL and the screen stays black.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs   ; "spiffs" partition (3.4 MB): firmware/data -> uploadfs
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    ; LVGL config via build flags (no lv_conf.h)
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_48=1
    ; LVGL's built-in heap is 64 KB by default, too small for the faces
    ; (Sky creates ~243 objects). Use the system allocator instead.
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lewisxhe/SensorLib@^0.2.6
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^9.2.0
