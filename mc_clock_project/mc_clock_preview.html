<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block clock faces preview</title>
<style>
  :root {
    color-scheme: light;
    --bg: #efeae0;
    --panel: #ffffff;
    --ink: #1d1a14;
    --muted: #6b6455;
    --line: #cfc7b4;
    --accent: #3f8f2a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141310;
      --panel: #1e1c17;
      --ink: #f1ecde;
      --muted: #a39b87;
      --line: #3a362c;
      --accent: #6ac24a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141310;
    --panel: #1e1c17;
    --ink: #f1ecde;
    --muted: #a39b87;
    --line: #3a362c;
    --accent: #6ac24a;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 14px 32px;
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: 0.01em; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; line-height: 1.45; max-width: 60ch; }
  .screen {
    background: #000;
    border-radius: 28px;
    padding: 10px;
    border: 2px solid var(--line);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    image-rendering: pixelated;
    cursor: pointer;
  }
  .tabs { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
    min-height: 44px;
  }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .row label { color: var(--muted); font-size: 0.95rem; }
  input[type=range] { flex: 1; min-width: 180px; accent-color: var(--accent); }
  output { min-width: 3.2em; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Block clock faces</h1>
  <p class="sub">Same drawing logic as the board firmware, at 480x480. Tap the screen for a random face, or pick one. Drag the slider to see the sky through the day.</p>

  <div class="screen"><canvas id="c" width="480" height="480" aria-label="Clock face preview"></canvas></div>

  <div class="tabs" role="group" aria-label="Face">
    <button data-face="0" aria-pressed="true">Sky</button>
    <button data-face="1" aria-pressed="false">Lamp</button>
    <button data-face="2" aria-pressed="false">Buddy</button>
    <button id="shuffle" aria-pressed="false">Shuffle</button>
  </div>

  <div class="row">
    <label for="t">Time</label>
    <input id="t" type="range" min="0" max="1439" value="0" aria-describedby="tv">
    <output id="tv"></output>
    <button id="live" aria-pressed="true">Live</button>
  </div>
</main>

<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  var DIGITS = [
    [0x0E,0x11,0x13,0x15,0x19,0x11,0x0E],[0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
    [0x0E,0x11,0x01,0x02,0x04,0x08,0x1F],[0x1E,0x01,0x01,0x0E,0x01,0x01,0x1E],
    [0x02,0x06,0x0A,0x12,0x1F,0x02,0x02],[0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E],
    [0x06,0x08,0x10,0x1E,0x11,0x11,0x0E],[0x1F,0x01,0x02,0x04,0x08,0x08,0x08],
    [0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E],[0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C]
  ];
  var DCOL = [0, 6, 14, 20];

  function rect(x, y, w, h, c, a) {
    ctx.globalAlpha = a == null ? 1 : a;
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
    ctx.globalAlpha = 1;
  }

  function grid(hh, mm, colon, x, y, pitch, size, on, off, offAlpha) {
    var dg = [Math.floor(hh / 10), hh % 10, Math.floor(mm / 10), mm % 10];
    for (var d = 0; d < 4; d++) {
      for (var r = 0; r < 7; r++) {
        for (var c = 0; c < 5; c++) {
          var lit = DIGITS[dg[d]][r] & (1 << (4 - c));
          var px = x + (DCOL[d] + c) * pitch, py = y + r * pitch;
          if (lit) rect(px, py, size, size, on, 1); else if (offAlpha > 0) rect(px, py, size, size, off, offAlpha);
        }
      }
    }
    [2, 4].forEach(function (r) {
      var px = x + 12 * pitch, py = y + r * pitch;
      if (colon) rect(px, py, size, size, on, 1); else if (offAlpha > 0) rect(px, py, size, size, off, offAlpha);
    });
  }
  var GX = Math.floor((480 - (24 * 17 + 15)) / 2);

  /* ---- clouds (positions loop like the LVGL animations) ---- */
  var CLOUDS = [{ y: 60, ms: 70000, delay: 0 }, { y: 150, ms: 95000, delay: 20000 }, { y: 100, ms: 80000, delay: 45000 }];
  function cloud(x, y, alpha) {
    rect(x, y + 16, 120, 24, '#fff', alpha);
    rect(x + 20, y, 60, 24, '#fff', alpha);
    rect(x + 70, y + 8, 40, 16, '#fff', alpha);
  }

  var STARS = [[30,40],[120,90],[200,30],[290,70],[360,25],[420,95],[70,150],[440,170]];

  function sky(h, m, s, ms, now) {
    var mins = h * 60 + m;
    var phase = (h >= 7 && h < 17) ? 2 : ((h === 5 || h === 6 || h === 17 || h === 18) ? 1 : 0);
    var sunUp = h >= 6 && h < 18;
    rect(0, 0, 480, 480, ['#0B1030', '#FF9A5C', '#78B4FF'][phase]);
    if (phase === 0) STARS.forEach(function (p) { rect(p[0], p[1], 6, 6, '#fff'); });
    var since = sunUp ? (mins - 360) : ((mins + 1440 - 1080) % 1440);
    var p = since / 720;
    rect(10 + p * (480 - 76), 30 + 180 * (1 - 4 * p * (1 - p)), 56, 56, sunUp ? '#FFE14D' : '#E8ECF4');
    var ca = [0.27, 0.78, 1][phase];
    CLOUDS.forEach(function (c) {
      var t = ((now - c.delay) % c.ms + c.ms) % c.ms;
      cloud(-150 + (480 + 150) * (t / c.ms), c.y, ca);
    });
    for (var row = 0; row < 4; row++) for (var col = 0; col < 20; col++) {
      var color = row === 0 ? ((col & 1) ? '#4F8F28' : '#5DA130') : (((col + row) & 1) ? '#6B4627' : '#7A5230');
      rect(col * 24, 384 + row * 24, 24, 24, color);
    }
    grid(h, m, s % 2 === 0, GX, 232, 17, 15, '#FFFFFF', '#000', 0);
  }

  function lamp(h, m, s, ms, now) {
    rect(0, 0, 480, 480, '#15100C');
    grid(h, m, s % 2 === 0, GX, 150, 17, 15, '#FFC24A', '#3A2A14', 1);
    var pulse = Math.floor(now / 150) % 24;
    for (var i = 0; i < 20; i++) {
      var c = '#3A0D0D';
      if (i === pulse) c = '#FF2B1F'; else if (i === pulse - 1) c = '#8A1A14';
      rect(i * 24 + 2, 372, 20, 12, c);
    }
  }

  var GREENS = ['#4CAF3E', '#43A036', '#5BBF4A'];
  function base(r, c) { return GREENS[(r * 7 + c * 13 + r * c) % 3]; }
  var SMILE = [[5,1],[5,6],[6,2],[6,3],[6,4],[6,5]];
  function buddy(h, m, s, ms, now) {
    rect(0, 0, 480, 480, '#1B3A19');
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) rect(136 + c * 26, 24 + r * 26, 26, 26, base(r, c));
    rect(136 + 1 * 26, 24 + 4 * 26, 26, 26, '#E88A8A');
    rect(136 + 6 * 26, 24 + 4 * 26, 26, 26, '#E88A8A');
    SMILE.forEach(function (p) { rect(136 + p[1] * 26, 24 + p[0] * 26, 26, 26, '#10230F'); });
    var blink = (Math.floor(now / 200) % 20) === 0;
    rect(136 + 2 * 26, 24 + 3 * 26, 26, 26, blink ? base(3, 2) : '#10230F');
    rect(136 + 5 * 26, 24 + 3 * 26, 26, 26, blink ? base(3, 5) : '#10230F');
    grid(h, m, s % 2 === 0, GX, 270, 17, 15, '#E9FFE5', '#24491F', 1);
  }

  var FACES = [sky, lamp, buddy];
  var face = 0, live = true, shuffleOn = false, lastShuffle = 0;
  var slider = document.getElementById('t'), tv = document.getElementById('tv');
  var tabs = document.querySelectorAll('[data-face]');
  var liveBtn = document.getElementById('live'), shuffleBtn = document.getElementById('shuffle');

  function fmt(mins) { return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0'); }
  function setFace(i) {
    face = i;
    tabs.forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.face) === i)); });
  }
  function randomFace() { var n; do { n = Math.floor(Math.random() * FACES.length); } while (n === face); setFace(n); }

  tabs.forEach(function (b) { b.addEventListener('click', function () { shuffleOn = false; shuffleBtn.setAttribute('aria-pressed', 'false'); setFace(Number(b.dataset.face)); }); });
  cv.addEventListener('click', randomFace);
  shuffleBtn.addEventListener('click', function () {
    shuffleOn = !shuffleOn; shuffleBtn.setAttribute('aria-pressed', String(shuffleOn)); lastShuffle = performance.now();
  });
  slider.addEventListener('input', function () {
    live = false; liveBtn.setAttribute('aria-pressed', 'false');
  });
  liveBtn.addEventListener('click', function () { live = true; liveBtn.setAttribute('aria-pressed', 'true'); });

  function frame(now) {
    var d = new Date(), h, m, s = d.getSeconds();
    if (live) { h = d.getHours(); m = d.getMinutes(); slider.value = h * 60 + m; }
    else { var v = Number(slider.value); h = Math.floor(v / 60); m = v % 60; }
    tv.textContent = fmt(h * 60 + m);
    if (shuffleOn && now - lastShuffle > 6000) { lastShuffle = now; randomFace(); }
    FACES[face](h, m, s, d.getMilliseconds(), now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
